paths:
  /products:
    get:
      summary: Get all products
      responses:
        '200':
          description: A list of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
    post:
      summary: Create a new product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '201':
          description: Product created
components:
  schemas:
    Product:
      type: object
      properties:
        id:
          type: string
        pictures:
          type: array
          items:
            type: string
        sizes:
          type: array
          items:
            type: string
        color:
          type: string
        brand:
          type: object
          properties:
            name:
              type: string
            logo:
              type: string
    ProductInput:
      type: object
      required:
        - pictures
        - sizes
        - color
        - brand
      properties:
        pictures:
          type: array
          items:
            type: string
        sizes:
          type: array
          items:
            type: string
        color:
          type: string
        brand:
          type: object
          required:
            - name
            - logo
          properties:
            name:
              type: string
            logo:
              type: string
